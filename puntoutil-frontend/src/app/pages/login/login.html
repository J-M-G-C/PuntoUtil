<div class="login-container">

  <div class="login-card">

    <div class="login-header">
      <div class="logo">🛒</div>

      <h1>PuntoÚtil</h1>

      <p>Inicia sesión para continuar</p>
    </div>

    <form
      [formGroup]="formulario"
      (ngSubmit)="iniciarSesion()">

      <div class="form-group">

        <label for="usuario">Usuario</label>

        <input
          id="usuario"
          type="text"
          formControlName="usuario"
          placeholder="Ingresa tu usuario"
          autocomplete="username">

        <small
          class="error"
          *ngIf="formulario.controls.usuario.touched &&
                 formulario.controls.usuario.invalid">

          Ingresa tu usuario.

        </small>

      </div>

      <div class="form-group">

        <label for="contrasena">Contraseña</label>

        <input
          id="contrasena"
          type="password"
          formControlName="contrasena"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password">

        <small
          class="error"
          *ngIf="formulario.controls.contrasena.touched &&
                 formulario.controls.contrasena.invalid">

          Ingresa tu contraseña.

        </small>

      </div>

      <div
        class="mensaje-error"
        *ngIf="mensajeError"
        role="alert">

        {{ mensajeError }}

      </div>

      <button
        type="submit"
        [disabled]="cargando">

        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}

      </button>

    </form>

    <div class="login-footer">
      <p>© PuntoÚtil - Sistema de Gestión</p>
    </div>

  </div>

</div>
