spring.application.name=puntoutil-backend
spring.datasource.url=jdbc:mysql://localhost:3306/puntoutil_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600
security.bootstrap-admin.username=${ADMIN_USERNAME:}
security.bootstrap-admin.password=${ADMIN_PASSWORD:}
security.bootstrap-admin.nombre=${ADMIN_NOMBRE:Administrador}
security.bootstrap-admin.email=${ADMIN_EMAIL:}
